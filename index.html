<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Ana Serrano | Product Designer</title>
    <!-- 2026-10-08, a pedido de Ana: agrega Inter (pesos 500/600/700) para
         la hora del status bar del mockup de iPhone (Home.jsx) — mandó una
         captura real de iOS pidiendo "algo más de iPhone". La fuente real
         del sistema (San Francisco) no es descargable vía Google Fonts (es
         de Apple, no de uso libre fuera de sus plataformas); en Mac/iOS el
         stack -apple-system ya mostraba San Francisco real, pero en
         Windows (donde Ana estaba probando) no existe esa fuente y caía a
         Arial/Segoe UI genérica, muy distinta a la referencia. Inter es de
         código abierto (OFL), se diseñó con métricas y proporciones muy
         cercanas a SF Pro, y es la alternativa estándar de la industria
         para mockups de iOS en cualquier sistema operativo. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&family=Sansita:wght@700&family=Didact+Gothic&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@100,300,400,700&display=swap" rel="stylesheet">
    <!-- 2026-10-12, a pedido de Ana: sección de tipografía del case de
         Thea (TheaTypographyShowcase en Home.jsx) -- muestra las 2
         tipografías REALES del Design System de Theaveling, no una
         imitación. Archivo (peso Thin, 100) y Instrument Sans (400/500/
         600) son ambas Google Fonts de uso libre, mismas que usa la app
         real de Theaveling. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 2026-11-06, a pedido de Ana: panel de "Bitácora huella" (Home.jsx)
         usa Poppins para el título (wordmark de Huella, mismo rol que
         Satoshi en Beacon y Sansita en Theaveling: identidad del
         producto, no texto narrativo). El texto narrativo del panel
         (subtítulo, descripción, etiquetas) sigue el mismo patrón que
         los otros dos cases y usa Plus Jakarta Sans -- la voz propia del
         portfolio -- en vez de una tipografía real de Huella, así que
         Manrope (que se había cargado acá para esto) ya no hace falta y
         se quita. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 2026-11-11, a pedido de Ana: tarjeta "Colores" dentro de la
         bitácora de Huella (HuellaColorPanel en Home.jsx) recrea el panel
         real de la sección de colores del design system -- verificado
         directo en Figma (get_design_context, nodo 2398:8579): el título
         "Colores" y el nombre de cada color SÍ son Poppins Medium (ya
         cargada arriba para el wordmark de Huella), pero el subtítulo y
         el hex de cada color son Manrope Regular, no Poppins. Manrope se
         había quitado el 2026-11-06 porque el texto NARRATIVO del panel
         (ese es Plus Jakarta Sans), pero esta tarjeta en particular es
         una recreación literal de una pantalla real que sí usa Manrope
         para esas dos piezas de texto, así que se vuelve a cargar acá
         solo para este caso puntual. -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
